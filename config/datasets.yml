    source_group: Future climate
    agricultural_theme: Future crop suitability and climate risk
    description: Future suitability and attainable-yield layers by crop, model, scenario and period.
    catalogue_url: https://gaez.fao.org/
    expected_spatial_coverage: Global
    expected_bbox: [-180, -90, 180, 90]
    expected_temporal_coverage: CMIP6 future periods; verify in v5 catalogue
    variables: crop suitability; attainable yield; scenario; model; future period
    licence: FAO terms; verify per layer
    authentication_requirement: Verify per service
    verification_method: official_catalogue_plus_minimal_service_or_raster_window
    initial_priority: SUPPORTING

