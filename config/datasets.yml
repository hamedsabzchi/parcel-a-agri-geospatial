datasets:
  - <<: *defaults
    dataset_id: FAO_GAEZ_V5_CURRENT
    source_name: GAEZ v5
    dataset_name: GAEZ v5 current agro-ecological resources and crop suitability
    provider: FAO and IIASA
    source_group: FAO
    agricultural_theme: Crop suitability and attainable yield
    description: Crop suitability, attainable yield, growing period, thermal and moisture regimes, soil quality, terrain constraints, land cover, irrigation and exclusions.
    catalogue_url: https://gaez.fao.org/
    expected_spatial_coverage: Global
    expected_bbox: [-180, -90, 180, 90]
    expected_temporal_coverage: Historical and baseline periods; verify v5 catalogue
    spatial_resolution: Verify from selected GAEZ v5 layer
    variables: suitability; attainable yield; LGP; thermal zones; moisture regimes; soil quality; terrain; irrigation; exclusions
    licence: FAO terms; verify per layer
    authentication_requirement: Verify per service
    verification_method: official_catalogue_plus_minimal_service_or_raster_window
    initial_priority: CORE
    notes: Do not substitute GAEZ v4 when v5 is requested; preserve crop, water regime and input level dimensions.

  - <<: *defaults
    dataset_id: FAO_GAEZ_V5_FUTURE
