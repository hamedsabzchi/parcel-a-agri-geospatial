stage_02_tests_pending:
- Open every selected official asset
- Confirm CRS, bounds, resolution, data type and intrinsic NoData
- Read only Parcel A window
- Confirm valid values/classes and AOI coverage
- Record evidence and promote only successful assets to VERIFIED_INSIDE_AOI
gaez_files_still_required:
  current:
  - Suitability and attainable yield for other priority crops after the crop list
    is finalized
  future_cmip6:
  - Future crop suitability for selected crops and chosen periods/scenarios
  - Future attainable yield for selected crops and chosen periods/scenarios
decision_required_before_next_search:
- Final priority crop list
- Rainfed and/or irrigated conditions
- Low and/or high input-management levels
- 'Preferred suitability output: class, index, or both'
- Future periods and SSPs; climate-model ensemble rule
completion_rule: GAEZ source work is complete only after crop-specific current and
  future assets are selected and all selected assets pass Parcel A AOI tests.
selection_sequence:
  completed:
  - 'Maize HP0120 suitability: HRLM, LRLM, HILM and LILM'
  - 'Maize HP0120 attainable yield: HRLM, LRLM, HILM and LILM'
  current_focus: Verify all 16 selected current maize and baseline assets inside Parcel A
    before selecting further crops
  next_decision_required:
  - Select the second priority crop
  - Retain HP0120 and all four water-input combinations unless the project scope is
    narrowed

