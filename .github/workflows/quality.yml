name: quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the locked Stage 02 environment
        run: python -m pip install -q -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check notebook matches its source bundle
        run: python tools/build_stage02.py --check
      - name: Validate AOI, verification gates and complete Stage 02 packaging
        run: python -m unittest discover -s tests -v
      - name: Validate notebook JSON
        run: |
          python -m json.tool notebooks/01_define_and_display_aoi.ipynb > /dev/null
          python -m json.tool notebooks/02_data_discovery.ipynb > /dev/null
